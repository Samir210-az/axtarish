name: Probe

on: workflow_dispatch

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx crawler/probe.ts > probe-output.md
      - name: Publish output
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git checkout --orphan probe-results
          git rm -rf --cached . > /dev/null 2>&1 || true
          git add -f probe-output.md
          git commit -m "probe output"
          git push -f origin probe-results
