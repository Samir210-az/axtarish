name: BM check

on: workflow_dispatch

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx crawler/bm-check.ts > bmcheck-output.md
      - name: Publish output
        run: |
          git config user.name "bmcheck-bot"
          git config user.email "bmcheck-bot@users.noreply.github.com"
          git checkout --orphan bmcheck-results
          git rm -rf --cached . > /dev/null 2>&1 || true
          git add -f bmcheck-output.md
          git commit -m "bm check output"
          git push -f origin bmcheck-results
