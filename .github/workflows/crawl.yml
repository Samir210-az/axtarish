name: Crawl

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Sayt id-ləri (vergüllə), boş olsa hamısı"
        required: false
        default: ""
      limit:
        description: "Sayt başına səhifə sayı"
        required: false
        default: "30"
      dry:
        description: "Bazaya yazma (true/false)"
        required: false
        default: "true"
      query:
        description: "Sorğu rejimi: məhsul adları (| ilə ayır), məsələn Dior Sauvage|sabun"
        required: false
        default: ""
      queue:
        description: "Saytda az nəticə verən axtarış növbəsini işlə (true/false)"
        required: false
        default: "false"
      inspect:
        description: "Diaqnostika: bir səhifənin ünvanı"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run crawler
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          INPUT_SOURCE: ${{ github.event.inputs.source }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
          INPUT_DRY: ${{ github.event.inputs.dry }}
          INPUT_INSPECT: ${{ github.event.inputs.inspect }}
          INPUT_QUERY: ${{ github.event.inputs.query }}
          INPUT_QUEUE: ${{ github.event.inputs.queue }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$INPUT_INSPECT" ]; then npx tsx crawler/run.ts --inspect "$INPUT_INSPECT" | tee crawl-output.md; exit 0; fi
          set -- --limit "${INPUT_LIMIT:-30}"
          if [ -n "$INPUT_SOURCE" ]; then set -- "$@" --source "$INPUT_SOURCE"; fi
          if [ -n "$INPUT_QUERY" ]; then set -- "$@" --query "$INPUT_QUERY"; fi
          if [ "$EVENT" = "schedule" ] || [ "$INPUT_QUEUE" = "true" ]; then set -- "$@" --queue; fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_DRY" != "false" ]; then set -- "$@" --dry; fi
          npx tsx crawler/run.ts "$@" | tee crawl-output.md
      - name: Publish output
        if: always()
        run: |
          git config user.name "crawl-bot"
          git config user.email "crawl-bot@users.noreply.github.com"
          git checkout --orphan crawl-results
          git rm -rf --cached . > /dev/null 2>&1 || true
          echo '{"git":{"deploymentEnabled":false},"ignoreCommand":"exit 0"}' > vercel.json
          git add -f crawl-output.md vercel.json
          git commit -m "crawl output"
          git push -f origin crawl-results
