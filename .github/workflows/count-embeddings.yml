name: Count embeddings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run count
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npx tsx crawler/count-embeddings.ts > count-embeddings-output.md 2>&1
          echo "exit_code=$?" >> count-embeddings-output.md
          cat count-embeddings-output.md
      - name: Publish output
        if: always()
        run: |
          git config user.name "backfill-bot"
          git config user.email "backfill-bot@users.noreply.github.com"
          git checkout --orphan count-embeddings-results
          git rm -rf --cached . > /dev/null 2>&1 || true
          echo '{"git":{"deploymentEnabled":false},"ignoreCommand":"exit 0"}' > vercel.json
          git add -f count-embeddings-output.md vercel.json
          git commit -m "count embeddings output"
          git push -f origin count-embeddings-results
