name: UA check

on: workflow_dispatch

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx crawler/ua-check.ts > uacheck-output.md
      - name: Publish output
        run: |
          git config user.name "uacheck-bot"
          git config user.email "uacheck-bot@users.noreply.github.com"
          git checkout --orphan uacheck-results
          git rm -rf --cached . > /dev/null 2>&1 || true
          git add -f uacheck-output.md
          git commit -m "ua check output"
          git push -f origin uacheck-results
