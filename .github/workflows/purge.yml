name: Purge excluded

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Yalnız siyahı (true/false)"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run purge
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          INPUT_DRY: ${{ github.event.inputs.dry }}
        run: |
          set --
          if [ "$INPUT_DRY" != "false" ]; then set -- --dry; fi
          npx tsx crawler/purge-excluded.ts "$@" | tee purge-output.md
      - name: Publish output
        if: always()
        run: |
          git config user.name "purge-bot"
          git config user.email "purge-bot@users.noreply.github.com"
          git checkout --orphan purge-results
          git rm -rf --cached . > /dev/null 2>&1 || true
          echo '{"git":{"deploymentEnabled":false},"ignoreCommand":"exit 0"}' > vercel.json
          git add -f purge-output.md vercel.json
          git commit -m "purge output"
          git push -f origin purge-results
