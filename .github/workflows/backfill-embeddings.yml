name: Backfill embeddings

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Yalnız say (true/false)"
        required: false
        default: "true"
      limit:
        description: "Ən çox neçə sənəd emal edilsin (boş = hamısı)"
        required: false
        default: ""
      delay:
        description: "Hər çağırış arası gecikmə (ms)"
        required: false
        default: "1500"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run backfill
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_DRY: ${{ github.event.inputs.dry }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
          INPUT_DELAY: ${{ github.event.inputs.delay }}
        run: |
          set --
          if [ "$INPUT_DRY" != "false" ]; then set -- --dry; fi
          if [ -n "$INPUT_LIMIT" ]; then set -- "$@" "--limit=$INPUT_LIMIT"; fi
          if [ -n "$INPUT_DELAY" ]; then set -- "$@" "--delay=$INPUT_DELAY"; fi
          npx tsx crawler/backfill-embeddings.ts "$@" 2>&1 | tee backfill-embeddings-output.md
      - name: Publish output
        if: always()
        run: |
          git config user.name "backfill-bot"
          git config user.email "backfill-bot@users.noreply.github.com"
          git checkout --orphan backfill-embeddings-results
          git rm -rf --cached . > /dev/null 2>&1 || true
          echo '{"git":{"deploymentEnabled":false},"ignoreCommand":"exit 0"}' > vercel.json
          git add -f backfill-embeddings-output.md vercel.json
          git commit -m "backfill embeddings output"
          git push -f origin backfill-embeddings-results
